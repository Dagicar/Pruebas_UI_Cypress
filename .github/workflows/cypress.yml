name: Suite de Pruebas e2e - Cypress

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Instalar dependencias exactas
        run: npm ci

      - name: 4. Ejecutar Pruebas de Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false # Ya las instalamos en el paso anterior

      - name: 5. Guardar Evidencias (Screenshots) si hay fallos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: 6. Guardar Reportes HTML de Mochawesome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report
          path: cypress/reports